<svg xmlns="http://www.w3.org/2000/svg" width="860" height="310" viewBox="0 0 860 310" role="img" aria-labelledby="title desc"><title id="title">1nsaneeee · zsh</title><desc id="desc">写点工具，也做游戏 · AI Agents · MC Modding · FGO Math. Last login 2026-11-24.</desc><style>text{font-family:'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,monospace}.bold{font-weight:700}.dim{font-style:italic}a:hover text{text-decoration:underline}
.lid,.glint,.cmd-slot{opacity:0}.cmd-first{opacity:1}
.cmd-caret{transform:translateX(var(--cx))}
@media(prefers-reduced-motion:no-preference){
  .tip-reel{animation:tips var(--cycle) steps(var(--pages),end) infinite}
  .tip-reel text{animation:tip-arrives 6s ease-out infinite}
  .eyes{animation:eyes 4.4s step-end infinite}.lid{animation:lid 4.4s step-end infinite}
  .star{animation:twinkle 3.8s ease-in-out infinite}.glint{animation:shine 7.6s ease-in-out 1.5s infinite}
  .paw{animation:reach 4.4s ease-in-out infinite}.mote{animation:dodge 4.4s ease-in-out infinite}
  .blink{animation:blink 1.05s steps(1,end) infinite}
  .cmd-slot{animation:slot-vis 18s linear var(--co) infinite}
  .cmd-reveal{animation:cmd-type 18s steps(14,end) var(--co) infinite}
  .cmd-caret{animation:caret-move 18s steps(14,end) var(--co) infinite}
  .cmd-out{animation:out-pop 18s ease-out var(--co) infinite}
}
@keyframes tips{from{transform:translateY(0)}to{transform:translateY(var(--travel))}}
@keyframes tip-arrives{0%{opacity:.35;transform:translateY(2px)}7%,93%{opacity:1;transform:translateY(0)}100%{opacity:.35}}
@keyframes eyes{0%,96%{opacity:1}92%{opacity:0}}@keyframes lid{0%,96%{opacity:0}92%{opacity:1}}
@keyframes reach{0%,61%,85%,100%{transform:translateX(0)}73%{transform:translate(7px,-2px)}}
@keyframes dodge{0%,69%,92%,100%{transform:translate(0,0)}79%{transform:translate(5px,-4px)}}
@keyframes twinkle{0%,55%,100%{opacity:.35}70%{opacity:1}}
@keyframes shine{0%{opacity:1;transform:translateX(66px)}25%{opacity:1;transform:translateX(-2px)}26%,100%{opacity:0;transform:translateX(-2px)}}
@keyframes blink{50%{opacity:0}}
@keyframes slot-vis{0%,32%{opacity:1}33.3%,99.5%{opacity:0}100%{opacity:1}}
@keyframes cmd-type{0%{transform:scaleX(0)}6.5%,33.3%,100%{transform:scaleX(1)}}
@keyframes caret-move{0%{transform:translateX(0)}6.5%,33.3%,100%{transform:translateX(var(--cx))}}
@keyframes out-pop{0%,6.5%{opacity:0;transform:translateY(2px)}9%,32%{opacity:1;transform:translateY(0)}33.3%,100%{opacity:0}}
</style><defs><filter id="win-shadow" x="-4%" y="-6%" width="108%" height="118%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.42"/></filter></defs><rect x="8" y="8" width="844" height="294" rx="11" fill="#0d1117" filter="url(#win-shadow)"/><path d="M8,42 V19 a11,11 0 0 1 11,-11 H841 a11,11 0 0 1 11,11 V42 Z" fill="#1b2c38"/><path d="M8 42.5H852" stroke="#30363d"/><rect x="8.5" y="8.5" width="843" height="293" rx="10.5" fill="none" stroke="#30363d"/><circle cx="28" cy="25" r="5.3" fill="#ff5f56"/><circle cx="46" cy="25" r="5.3" fill="#ffbd2e"/><circle cx="64" cy="25" r="5.3" fill="#27c93f"/><text x="430" y="29.5" font-size="12.5" fill="#8b949e" text-anchor="middle">1nsaneeee@github: ~ — zsh</text><text x="834" y="29" font-size="11" fill="#6e7681" text-anchor="end">Last login: 2026-11-24</text><g transform="translate(0 42)"><svg x="30" y="10" width="800" height="28" overflow="hidden"><g class="tip-reel" style="--pages:24;--cycle:144s;--travel:-672px"><text x="400" y="19" text-anchor="middle" font-size="13.5"><tspan fill="#e3b341" class="bold">TIP › </tspan><tspan fill="#e6edf3">尊敬的VIP用户,已为您跳过一个冷笑话</tspan></text><text x="400" y="47" text-anchor="middle" font-size="13.5"><tspan fill="#e3b341" class="bold">TIP › </tspan><tspan fill="#e6edf3">写了一小时自动化脚本，省下了三分钟手动操作。</tspan></text><text x="400" y="75" text-anchor="middle" font-size="13.5"><tspan fill="#e3b341" class="bold">TIP › </tspan><tspan fill="#e6edf3">AI的话听不懂? 让另一个AI帮你听</tspan></text><text x="400" y="103" text-anchor="middle" font-size="13.5"><tspan fill="#e3b341" class="bold">TIP › </tspan><tspan fill="#e6edf3">终端其实就是前端</tspan></text><text x="400" y="131" text-anchor="middle" font-size="13.5"><tspan fill="#e3b341" class="bold">TIP › </tspan><tspan fill="#e6edf3">世界最流行的编程语言是:求求你帮我...</tspan></text><text x="400" y="159" text-anchor="middle" font-size="13.5"><tspan fill="#e3b341" class="bold">TIP › </tspan><tspan fill="#e6edf3">此页面由 100% 纯手工的 AI 完成。</tspan></text><text x="400" y="187" text-anchor="middle" font-size="13.5"><tspan fill="#e3b341" class="bold">TIP › </tspan><tspan fill="#e6edf3">正在为你提供更个性化的摸鱼体验……</tspan></text><text x="400" y="215" text-anchor="middle" font-size="13.5"><tspan fill="#e3b341" class="bold">TIP › </tspan><tspan fill="#e6edf3">正在编译着色器 (1 / 114514)……</tspan></text><text x="400" y="243" text-anchor="middle" font-size="13.5"><tspan fill="#e3b341" class="bold">TIP › </tspan><tspan fill="#e6edf3">着色器编译失败</tspan></text><text x="400" y="271" text-anchor="middle" font-size="13.5"><tspan fill="#e3b341" class="bold">TIP › </tspan><tspan fill="#e6edf3">欢迎来到英雄联盟</tspan></text><text x="400" y="299" text-anchor="middle" font-size="13.5"><tspan fill="#e3b341" class="bold">TIP › </tspan><tspan fill="#e6edf3">再写3个tips就达标了</tspan></text><text x="400" y="327" text-anchor="middle" font-size="13.5"><tspan fill="#e3b341" class="bold">TIP › </tspan><tspan fill="#e6edf3">啊怎么是4个</tspan></text><text x="400" y="355" text-anchor="middle" font-size="13.5"><tspan fill="#e3b341" class="bold">TIP › </tspan><tspan fill="#e6edf3">现在是2个了</tspan></text><text x="400" y="383" text-anchor="middle" font-size="13.5"><tspan fill="#e3b341" class="bold">TIP › </tspan><tspan fill="#e6edf3">哦耶最后1个</tspan></text><text x="400" y="411" text-anchor="middle" font-size="13.5"><tspan fill="#e3b341" class="bold">TIP › </tspan><tspan fill="#e6edf3">你怎么还在看...</tspan></text><text x="400" y="439" text-anchor="middle" font-size="13.5"><tspan fill="#e3b341" class="bold">TIP › </tspan><tspan fill="#e6edf3">观看成功, 今日免费次数(0 / 3)</tspan></text><text x="400" y="467" text-anchor="middle" font-size="13.5"><tspan fill="#e3b341" class="bold">TIP › </tspan><tspan fill="#e6edf3">正在静默启动《崩坏: 星穹铁道》</tspan></text><text x="400" y="495" text-anchor="middle" font-size="13.5"><tspan fill="#e3b341" class="bold">TIP › </tspan><tspan fill="#e6edf3">正在静默启动《绝区零》</tspan></text><text x="400" y="523" text-anchor="middle" font-size="13.5"><tspan fill="#e3b341" class="bold">TIP › </tspan><tspan fill="#e6edf3">正在静默启动《鸣潮》</tspan></text><text x="400" y="551" text-anchor="middle" font-size="13.5"><tspan fill="#e3b341" class="bold">TIP › </tspan><tspan fill="#e6edf3">正在...算了.. 全部启动</tspan></text><text x="400" y="579" text-anchor="middle" font-size="13.5"><tspan fill="#e3b341" class="bold">TIP › </tspan><tspan fill="#e6edf3">检测到访客正在使用代理,已自动提交相关材料至有关部门</tspan></text><text x="400" y="607" text-anchor="middle" font-size="13.5"><tspan fill="#e3b341" class="bold">TIP › </tspan><tspan fill="#e6edf3">基洛夫空艇正在报到</tspan></text><text x="400" y="635" text-anchor="middle" font-size="13.5"><tspan fill="#e3b341" class="bold">TIP › </tspan><tspan fill="#e6edf3">美索不达米亚地区是个历史悠久的古文化传承地</tspan></text><text x="400" y="663" text-anchor="middle" font-size="13.5"><tspan fill="#e3b341" class="bold">TIP › </tspan><tspan fill="#e6edf3">助战列表刷新了十次，怎么还是异星之神?</tspan></text></g></svg><g transform="translate(0 32)"><defs><path id="name" d="M2 0h2v1h-2zM1 1h3v1h-3zM2 2h2v1h-2zM2 3h2v1h-2zM2 4h2v1h-2zM2 5h2v1h-2zM0 6h5v1h-5zM6 2h2v1h-2zM9 2h1v1h-1zM6 3h5v1h-5zM6 4h2v1h-2zM9 4h2v1h-2zM6 5h2v1h-2zM9 5h2v1h-2zM6 6h2v1h-2zM9 6h2v1h-2zM13 2h4v1h-4zM12 3h2v1h-2zM13 4h3v1h-3zM15 5h2v1h-2zM12 6h4v1h-4zM19 2h3v1h-3zM21 3h2v1h-2zM19 4h4v1h-4zM18 5h2v1h-2zM21 5h2v1h-2zM19 6h4v1h-4zM24 2h2v1h-2zM27 2h1v1h-1zM24 3h5v1h-5zM24 4h2v1h-2zM27 4h2v1h-2zM24 5h2v1h-2zM27 5h2v1h-2zM24 6h2v1h-2zM27 6h2v1h-2zM31 2h3v1h-3zM30 3h2v1h-2zM33 3h2v1h-2zM30 4h5v1h-5zM30 5h2v1h-2zM31 6h4v1h-4zM37 2h3v1h-3zM36 3h2v1h-2zM39 3h2v1h-2zM36 4h5v1h-5zM36 5h2v1h-2zM37 6h4v1h-4zM43 2h3v1h-3zM42 3h2v1h-2zM45 3h2v1h-2zM42 4h5v1h-5zM42 5h2v1h-2zM43 6h4v1h-4zM49 2h3v1h-3zM48 3h2v1h-2zM51 3h2v1h-2zM48 4h5v1h-5zM48 5h2v1h-2zM49 6h4v1h-4z"/><linearGradient id="ink" x2="0" y2="1"><stop stop-color="#7ee787"/><stop offset="1" stop-color="#79c0ff"/></linearGradient><pattern id="scan" width="1" height=".5" patternUnits="userSpaceOnUse"><path d="M0 .46H1" stroke="#091017" stroke-opacity="0.24" stroke-width=".08"/></pattern><clipPath id="face"><use href="#name