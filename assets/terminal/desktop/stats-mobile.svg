<svg xmlns="http://www.w3.org/2000/svg" width="384" height="46" viewBox="0 1210 384 46" role="group" aria-labelledby="screen-title"><title id="screen-title">Insaneeee · AI agent desktop · 83 commits · 2026-11-24</title><style>text{font-family:'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,monospace}a{text-decoration:none}a:hover .ref{text-decoration:underline}.note{font-style:italic}.fold-show{display:none}#thoughts-folded:target~g .thoughts{display:none}#thoughts-folded:target~g .fold-show{display:inline}#thoughts-folded:target~g .fold-hide{display:none}@media(prefers-reduced-motion:no-preference){.reveal{animation:typing 1.05s steps(15,end) .06s both}.type-caret{animation:travel 1.05s steps(15,end) .06s both}.blink{animation:blink 1.1s steps(1,end) infinite}.spin{animation:spin 1.4s steps(10,end) infinite}.open-eye{animation:eye 4.7s step-end infinite}.closed-eye{animation:lid 4.7s step-end infinite}.paw-long{animation:paw 4.7s step-end infinite}.paw-short{animation:rest 4.7s step-end infinite}.prey{animation:prey 4.7s step-end infinite}.sweep{animation:sweep 5.4s linear 1.15s infinite}.restore{animation:restore .32s ease-out var(--delay,.14s) backwards}.note{animation:stream .22s ease-out var(--delay,1.1s) backwards}}@keyframes typing{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes travel{from{transform:translateX(0)}to{transform:translateX(126px)}}@keyframes blink{50%{opacity:0}}@keyframes spin{to{transform:translateY(-140px)}}@keyframes eye{0%,97%{opacity:1}94%{opacity:0}}@keyframes lid{0%,97%{opacity:0}94%{opacity:1}}@keyframes sweep{0%{transform:translateX(70px)}36%,100%{transform:translateX(-2px)}}@keyframes paw{0%,70%{opacity:0}40%{opacity:1}}@keyframes rest{0%,70%{opacity:1}40%{opacity:0}}@keyframes prey{0%,80%{transform:translateX(5px)}40%{transform:translateX(0)}70%{transform:translateX(-14px)}}@keyframes restore{from{opacity:.35}to{opacity:1}}@keyframes stream{from{opacity:0}to{opacity:1}}</style><defs><pattern id="dots" width="5"