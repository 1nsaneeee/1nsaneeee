<svg xmlns="http://www.w3.org/2000/svg" width="860" height="230" viewBox="0 0 860 230" role="img" aria-labelledby="title desc"><title id="title">1nsaneeee · zsh</title><desc id="desc">写点工具，也做游戏。给 Minecraft 写模组，给 FGO 算伤害。Last login 2026-11-24.</desc><style>text{font-family:'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,monospace}.bold{font-weight:700}.dim{font-style:italic}a:hover text{text-decoration:underline}
.lid,.glint{opacity:0}.caret{transform:translateX(90px)}
@media(prefers-reduced-motion:no-preference){
