name: Refresh profile activity

on:
  push:
    branches: [main]
    paths: [coldjokeconfig, chaldeas/AGENTS.md, Minecraft/SKILL.md]
  schedule:
    - cron: '17 0 * * *' # 08:17 in Hong Kong
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Generate activity from public repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B refresh_activity.py

      - name: Publish changed profile files
        run: |
          git add -- README.md assets/terminal
          if git diff --cached --quiet; then
            echo "Profile is already up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh profile activity'
          git push origin HEAD:main
